name: Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - 'prog/**'
      - '.github/workflows/build-and-test.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'prog/**'
      - '.github/workflows/build-and-test.yml'
      - 'docker-compose.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test prog service
        run: |
          # Build with output capture to verify tests ran
          docker-compose build prog 2>&1 | tee build.log

          # Verify build succeeded
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✓ Build completed successfully"
          else
            echo "✗ Build failed"
            exit 1
          fi

          # Verify each test gate actually ran and passed
          GATES_OK=true

          # Check pytest: at least 1 test passed, none failed
          if grep -qP "[1-9][0-9]* passed" build.log && ! grep -qP "[1-9][0-9]* failed" build.log; then
            echo "✓ Python tests passed"
          else
            echo "✗ Python tests did not pass or were not executed"
            grep -A 10 "test session starts" build.log || true
            GATES_OK=false
          fi

          # Check Catch2 C++ tests
          if grep -qE "All tests passed|test case.*assertion.*passed" build.log; then
            echo "✓ C++ tests passed"
          else
            echo "✗ C++ tests did not pass or were not executed"
            GATES_OK=false
          fi

          # Check Valgrind
          if grep -q "ERROR SUMMARY: 0 errors" build.log; then
            echo "✓ Valgrind passed"
          else
            echo "✗ Valgrind did not pass or was not executed"
            GATES_OK=false
          fi

          if [ "$GATES_OK" = false ]; then
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sbox-artifacts
          path: |
            artifacts/prog/libsboxevolution.so
            artifacts/prog/libsboxevolution_*.deb
          retention-days: 7
