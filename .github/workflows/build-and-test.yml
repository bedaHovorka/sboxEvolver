name: Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - 'prog/**'
      - '.github/workflows/build-and-test.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'prog/**'
      - '.github/workflows/build-and-test.yml'
      - 'docker-compose.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test prog service
        run: |
          # Build with output capture to verify tests ran
          docker-compose build prog 2>&1 | tee build.log

          # Verify build succeeded
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✓ Build completed successfully"
          else
            echo "✗ Build failed"
            exit 1
          fi

          # Verify tests actually ran and passed
          if grep -qP "\d+ passed" build.log && ! grep -qP "\d+ failed" build.log; then
            echo "✓ All tests passed"
          else
            echo "✗ Tests did not pass or were not executed properly"
            cat build.log | grep -A 10 "test session starts" || echo "No test execution found"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sbox-artifacts
          path: |
            artifacts/prog/libsboxevolution.so
            artifacts/prog/libsboxevolution_*.deb
          retention-days: 7
