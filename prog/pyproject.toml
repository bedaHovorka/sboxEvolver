[project]
name = "sboxevolver"
version = "2.0.0"
description = "S-box Evolver - Cryptographic S-box design using evolutionary algorithms"
authors = [{name = "Bedrich Hovorka"}]
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.26.4,<2.0.0",      # Stable 1.x, avoid 2.x breaking changes
    "matplotlib>=3.9.0",          # Modern plotting with Python 3.13 support
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "assertpy>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main/python"]

[tool.pytest.ini_options]
testpaths = ["src/test/python"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "assertpy>=1.1",
]
